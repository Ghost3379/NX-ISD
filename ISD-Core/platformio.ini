; NX-ISD PIO configuration file

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1   ; CHANGE to your actual display driver (e.g., GC9A01_DRIVER, ILI9341_DRIVER)
    -D TFT_WIDTH=240     ; CHANGE to your display width
    -D TFT_HEIGHT=240    ; CHANGE to your display height
    -D TFT_MISO=41
    -D TFT_MOSI=42
    -D TFT_SCLK=40
    -D TFT_CS=48
    -D TFT_DC=21         ; RS pin in your schematic maps to DC (Data/Command)
    -D TFT_RST=38
    -D SPI_FREQUENCY=27000000
lib_deps =
    bodmer/TFT_eSPI
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit BNO08x
    boschsensortec/BME68x Sensor library
    closedcube/ClosedCube OPT3001
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    adafruit/Adafruit MAX1704X
    constiko/RTC RV-3028-C7 Arduino Library